name: GPG Sign Modified Files

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  sign-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent

      - name: Get list of modified files
        id: changed-files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '\.(sh|py|yml|tf)$' \
            | grep -v '^\.github/') || true
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Sign modified files
        if: steps.changed-files.outputs.files != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_TTY: /dev/null
        run: |
          bash .github/scripts/sign-files.sh "${{ steps.changed-files.outputs.files }}"

      - name: Commit signatures
        if: steps.changed-files.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.gpg.sig'
          if git diff --cached --quiet; then
            echo "No new signatures to commit."
          else
            git commit -m "chore: add GPG signatures for modified files [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Post signature report
        if: steps.changed-files.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.changed-files.outputs.files }}`.trim().split('\n').filter(Boolean);
            const signed = files.map(f => `- \`${f}\` → \`${f}.gpg.sig\``).join('\n');
            const body = [
              '## 🔐 GPG Signature Report',
              '',
              'The following files were cryptographically signed in this PR:',
              '',
              signed,
              '',
              'To verify a signature, run:',
              '```bash',
              'gpg --verify <file>.gpg.sig <file>',
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: No signable files found
        if: steps.changed-files.outputs.files == ''
        run: echo "No .sh/.py/.yml/.tf files were modified in this PR — nothing to sign."
