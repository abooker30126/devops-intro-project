# GPG configuration for Jenkins CI / automated signing
#
# Used by gpg-resign-commits.sh and any Jenkins job that performs
# GPG commit signing.  Place this file (or symlink it) as ~/.gnupg/gpg.conf
# on the Jenkins agent host.

# Never prompt for user input in non-interactive / CI environments
no-tty
batch

# Always use the GPG agent for key-caching
use-agent

# Allow the agent to receive the passphrase via loopback (needed when
# there is no pinentry program available on a headless build agent)
pinentry-mode loopback

# Default key used for signing – override at runtime with
#   git config --global user.signingkey <KEY_ID>
# or by setting the environment variable GNUPGHOME to a directory
# that contains a gpg.conf with the desired default-key set.
# default-key <KEY_FINGERPRINT>

# Use a strong digest algorithm for signatures
personal-digest-preferences SHA512 SHA384 SHA256

# Ensure cross-certification subkeys are present (hardened key validation)
require-cross-certification

# Silence the "you need a passphrase" prompt
quiet
